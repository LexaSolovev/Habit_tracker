name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8

    - name: Run tests with coverage
      env:
        DB_ENGINE: django.db.backends.postgresql
        DB_NAME: test_db
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        SECRET_KEY: test-secret-key-for-ci-cd
        DEBUG: True
        ALLOWED_HOSTS: localhost,127.0.0.1
      run: |
        coverage run --source='.' manage.py test
        coverage report

    - name: Run linter
      run: |
        flake8 --exclude=*/migrations/* --max-line-length=119 --count --statistics

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production server
      uses: appleboy/ssh-action@v0.1.5
      env:
        SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.PROD_TELEGRAM_BOT_TOKEN }}
        ALLOWED_HOSTS: ${{ secrets.PROD_ALLOWED_HOSTS }}
        DOCKER_IMAGE: ghcr.io/${{ github.repository }}:latest
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        envs: SECRET_KEY,DB_PASSWORD,REDIS_PASSWORD,TELEGRAM_BOT_TOKEN,ALLOWED_HOSTS,DOCKER_IMAGE
        script: |
          cd /opt/habit-tracker
          
          # Копируем файлы деплоя
          if [ ! -f "docker-compose.prod.yml" ]; then
            echo "Копирование docker-compose.prod.yml..."
            cp $GITHUB_WORKSPACE/docker-compose.prod.yml .
          fi
          
          if [ ! -f "deploy/deploy.sh" ]; then
            echo "Копирование скрипта деплоя..."
            mkdir -p deploy
            cp $GITHUB_WORKSPACE/deploy/deploy.sh deploy/
            chmod +x deploy/deploy.sh
          fi
          
          if [ ! -f "nginx/nginx.conf" ]; then
            echo "Копирование конфигурации nginx..."
            mkdir -p nginx
            cp $GITHUB_WORKSPACE/nginx/nginx.conf nginx/
          fi
          
          # Выполняем деплой
          ./deploy/deploy.sh
          
          # Проверяем статус
          docker-compose -f docker-compose.prod.yml ps
          
          echo "✅ Деплой завершен успешно!"